<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Converter</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial Black, Arial, sans-serif;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
        }

        .container {
            background: #ffeb3b;
            border: 4px solid #000;
            padding: 30px;
            width: 380px;
            box-shadow: 8px 8px 0 #000;
        }

        h1 {
            text-align: center;
            border-bottom: 4px solid #000;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .box {
            border: 3px solid #000;
            padding: 10px;
            margin-bottom: 10px;
            background: #fff;
            box-shadow: 4px 4px 0 #000;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Time Converter</h1>

        <div class="box" id="second"></div>
        <div class="box" id="time"></div>
    </div>

    <script>
        let second = parseInt(prompt("Enter Seconds To Convert : "));
        document.getElementById("second").innerText =`Seconds : ${second}`;

        let hour = Math.floor(second / 3600);
        let minu = Math.floor((second % 3600) / 60);
        let sec = Math.floor(second % 60);

        let hh = String(hour).padStart(2, "0");
        let mm = String(minu).padStart(2, "0");
        let ss = String(sec).padStart(2, "0");

        document.getElementById("time").innerText = `Time (HH : MM : SS) = ${hh} : ${mm} : ${ss}`;
    </script>

</body>

</html>
