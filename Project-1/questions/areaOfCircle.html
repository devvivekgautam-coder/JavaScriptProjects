<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area Of Circle</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial Black, Arial, sans-serif;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
        }

        .container {
            background: #ffeb3b;
            border: 4px solid #000;
            padding: 30px;
            width: 340px;
            box-shadow: 8px 8px 0 #000;
        }

        h1 {
            margin: 0 0 20px;
            font-size: 26px;
            text-transform: uppercase;
            text-align: center;
            border-bottom: 4px solid #000;
            padding-bottom: 10px;
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 3px solid #000;
            background: #fff;
            font-size: 16px;
            outline: none;
            box-shadow: 4px 4px 0 #000;
        }

        h2 {
            margin-top: 15px;
            padding: 12px;
            border: 3px solid #000;
            background: #fff;
            box-shadow: 4px 4px 0 #000;
            text-align: center;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Area Of Circle</h1>

        <div class="field">
            <label>Radius</label>
            <input type="number" id="radiusInput">
        </div>

        <h2 id="area"></h2>
    </div>

    <script>
        let radius = Number(prompt("Enter Radius of Circle : "));

        document.getElementById("radiusInput").value = radius;

        let area = 3.14 * radius * radius;
        document.getElementById("area").innerText = `Area : ${area}`;
    </script>

</body>
</html>
