<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Age Calculator</title>

<style>
    * {
        box-sizing: border-box;
        font-family: Arial Black, Arial, sans-serif;
    }

    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f5f5f5;
    }

    .container {
        background: #ffeb3b;
        border: 4px solid #000;
        padding: 30px;
        width: 340px;
        box-shadow: 8px 8px 0 #000;
    }

    h1 {
        text-align: center;
        border-bottom: 4px solid #000;
        padding-bottom: 10px;
        margin-bottom: 20px;
    }

    .box {
        border: 3px solid #000;
        padding: 12px;
        margin-bottom: 12px;
        background: #fff;
        box-shadow: 4px 4px 0 #000;
        font-size: 18px;
        text-align: center;
    }
</style>
</head>

<body>

<div class="container">
    <h1>Age Calculator</h1>

    <!-- THESE MATCH YOUR JS -->
    <div class="box" id="currentYear"></div>
    <div class="box" id="birthYear"></div>
    <div class="box" id="age"></div>
</div>

<!-- JS pasted here (unchanged) -->
<script>
    let currentYear = Number(prompt("Enter Current Year : "))
    document.getElementById("currentYear").innerText = `Current Year : ${currentYear}`;

    let birthYear = Number(prompt("Enter Your Birth Year : "));
    document.getElementById("birthYear").innerText = `Birth Year : ${birthYear}`;

    let age = currentYear - birthYear;
    document.getElementById("age").innerText = `Current Age : ${age}`;
</script>

</body>
</html>
