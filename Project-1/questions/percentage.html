<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percentage</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial Black, Arial, sans-serif;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
        }

        .container {
            background: #ffeb3b;
            border: 4px solid #000;
            padding: 30px;
            width: 360px;
            box-shadow: 8px 8px 0 #000;
        }

        h1 {
            text-align: center;
            border-bottom: 4px solid #000;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .box {
            border: 3px solid #000;
            padding: 10px;
            margin-bottom: 10px;
            background: #fff;
            box-shadow: 4px 4px 0 #000;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Student Marks System</h1>

        <div class="box" id="name"></div>
        <div class="box" id="sub1"></div>
        <div class="box" id="sub2"></div>
        <div class="box" id="sub3"></div>
        <div class="box" id="sub4"></div>
        <div class="box" id="sub5"></div>
        <div class="box" id="total"></div>
        <div class="box" id="percentage"></div>
    </div>

    <script>
        let name = prompt("Enter Student's Name : ");
        document.getElementById("name").innerText = `Name : ${name}`;

        let sub1 = Number(prompt("Enter Subject 1 Marks : "));
        document.getElementById("sub1").innerText = `Subject 1 : ${sub1}`;

        let sub2 = Number(prompt("Enter Subject 2 Marks : "));
        document.getElementById("sub2").innerText = `Subject 2 : ${sub2}`;

        let sub3 = Number(prompt("Enter Subject 3 Marks : "));
        document.getElementById("sub3").innerText = `Subject 3 : ${sub3}`;

        let sub4 = Number(prompt("Enter Subject 4 Marks : "));
        document.getElementById("sub4").innerText = `Subject 4 : ${sub4}`;

        let sub5 = Number(prompt("Enter Subject 5 Marks : "));
        document.getElementById("sub5").innerText = `Subject 5 : ${sub5}`;

        let total = sub1 + sub2 + sub3 + sub4 + sub5;
        document.getElementById("total").innerText = `Total : ${total} / 500`;

        let percentage = ((total * 100) / 500).toFixed(2);
        document.getElementById("percentage").innerText = `Percentage : ${percentage}%`;
    </script>

</body>

</html>
