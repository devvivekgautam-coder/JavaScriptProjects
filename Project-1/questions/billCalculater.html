<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bill Calculator</title>

<style>
    * {
        box-sizing: border-box;
        font-family: Arial Black, Arial, sans-serif;
    }

    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f5f5f5;
    }

    .container {
        background: #ffeb3b;
        border: 4px solid #000;
        padding: 30px;
        width: 340px;
        box-shadow: 8px 8px 0 #000;
    }

    h1 {
        margin: 0 0 20px;
        text-align: center;
        text-transform: uppercase;
        border-bottom: 4px solid #000;
        padding-bottom: 10px;
    }

    label {
        display: block;
        margin-bottom: 6px;
        font-size: 14px;
    }

    input {
        width: 100%;
        padding: 12px;
        margin-bottom: 14px;
        border: 3px solid #000;
        font-size: 16px;
        box-shadow: 4px 4px 0 #000;
        outline: none;
        background: #fff;
    }

    h2 {
        margin-top: 15px;
        padding: 12px;
        border: 3px solid #000;
        background: #fff;
        box-shadow: 4px 4px 0 #000;
        text-align: center;
        font-size: 18px;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Bill Calculator</h1>

    <label>Item 1 Price</label>
    <input type="number" id="item1">

    <label>Item 2 Price</label>
    <input type="number" id="item2">

    <label>Item 3 Price</label>
    <input type="number" id="item3">

    <h2 id="bill"></h2>
</div>

<script>
    let item1 = Number(prompt("Enter 1st Item's Rate : "));
    let item2 = Number(prompt("Enter 2nd Item's Rate : "));
    let item3 = Number(prompt("Enter 3rd Item's Rate : "));

    document.getElementById("item1").value = item1;
    document.getElementById("item2").value = item2;
    document.getElementById("item3").value = item3;

    let bill = item1 + item2 + item3;
    document.getElementById("bill").innerText = `Total Bill : ₹${bill}`;
</script>

</body>
</html>
