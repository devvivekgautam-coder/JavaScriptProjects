<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial Black, Arial, sans-serif;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
        }

        .container {
            background: #ffeb3b;
            border: 4px solid #000;
            padding: 30px;
            width: 340px;
            box-shadow: 8px 8px 0 #000;
        }

        h1 {
            text-align: center;
            border-bottom: 4px solid #000;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .box {
            border: 3px solid #000;
            padding: 12px;
            margin-bottom: 12px;
            background: #fff;
            box-shadow: 4px 4px 0 #000;
            font-size: 18px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Currency Converter</h1>

        <div class="box" id="inr"></div>
        <div class="box" id="usd"></div>
    </div>

    <script>
        let INR = Number(prompt("Enter Amount To Convert : "));
        document.getElementById("inr").innerText = `INR : ${INR}`;

        let USD = (INR / 83).toFixed(2);
        document.getElementById("usd").innerText = `USD : ${USD}`;
    </script>

</body>

</html>
