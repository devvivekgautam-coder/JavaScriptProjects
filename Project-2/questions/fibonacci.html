<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fibonacci Series</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Arial Black', sans-serif;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #0a0a0a;
            background-image: 
                linear-gradient(rgba(0, 255, 204, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 204, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        body::before {
            content: "";
            position: absolute;
            width: 450px;
            height: 450px;
            background: #00ffcc;
            filter: blur(180px);
            opacity: 0.15;
            z-index: 0;
        }

        .neo-glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);            
            border: 4px solid #000;
            box-shadow: 15px 15px 0px #000;
            padding: 40px;
            width: 90%;
            max-width: 450px;
            color: #fff;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 24px;
            text-transform: uppercase;
            background: #ff0055;
            color: #fff;
            padding: 12px;
            border: 4px solid #000;
            margin-bottom: 30px;
            box-shadow: 6px 6px 0px #000;
        }

        label {
            display: block;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 3px;
            color: #00ffcc;
        }

        h2 {
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            border: 2px solid #333;
            padding: 15px;
            margin-top: 15px;
            font-size: 18px;
            word-wrap: break-word;
        }

        #fibo {
            background: #fff;
            color: #000;
            border: 4px solid #000;
            box-shadow: 5px 5px 0px #000;
            font-size: 20px;
            max-height: 250px;
            overflow-y: auto;
            line-height: 1.5;
            padding: 20px;
        }

        #fibo::-webkit-scrollbar { width: 10px; }
        #fibo::-webkit-scrollbar-track { background: #000; }
        #fibo::-webkit-scrollbar-thumb { background: #ff0055; border: 2px solid #000; }

    </style>
</head>
<body>

    <div class="neo-glass-card">
        <h1>Fibonacci Series</h1>
        
        <label>System Processing</label>
        
        <h2 id="num"></h2>
        <div id="fibo"></div>
    </div>

    <script>
        let num = Number(prompt("Enter Any Number To Find Fibonacci Series : "));
        document.getElementById("num").innerText = `Terms: ${num}`;

        let a = 0;
        let b = 1;
        let fiboText = "";

        for (let i = 1; i <= num; i++) {
            fiboText += a + " ";
            let c = a + b;
            a = b;
            b = c;
        }

        document.getElementById("fibo").innerText = fiboText;
    </script>
</body>
</html>
