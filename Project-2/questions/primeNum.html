<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Number</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Arial Black', sans-serif;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #121212;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        body::before {
            content: "";
            position: absolute;
            width: 400px;
            height: 400px;
            background: #00ffcc;
            filter: blur(150px);
            opacity: 0.15;
            z-index: 0;
        }

        .neo-glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 4px solid #000;
            box-shadow: 12px 12px 0px #000;
            padding: 35px;
            width: 380px;
            text-align: center;
            color: #fff;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 24px;
            background: #00ffcc;
            color: #000;
            padding: 12px;
            border: 4px solid #000;
            margin-bottom: 25px;
            box-shadow: 6px 6px 0px #000;
            text-transform: uppercase;
        }

        .tag {
            background: #000;
            color: #00ffcc;
            padding: 4px 12px;
            font-size: 11px;
            display: inline-block;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        h2#num {
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            border: 3px solid #000;
            padding: 12px;
            font-size: 18px;
            margin-bottom: 20px;
            box-shadow: 4px 4px 0px #000;
        }

        #prime {
            background: #fff;
            color: #000;
            border: 4px solid #000;
            padding: 15px;
            font-size: 20px;
            min-height: 100px;
            max-height: 250px;
            overflow-y: auto;
            box-shadow: 8px 8px 0px #000;
            word-wrap: break-word;
            line-height: 1.6;
        }

        #prime::-webkit-scrollbar { width: 10px; }
        #prime::-webkit-scrollbar-track { background: #000; }
        #prime::-webkit-scrollbar-thumb { background: #00ffcc; border: 2px solid #000; }

    </style>
</head>
<body>

    <div class="neo-glass-card">
        <h1>Prime Finder</h1>
        
        <div class="tag">Input Range</div>
        <h2 id="num">Range: --</h2>

        <div class="tag">Prime Numbers Found</div>
        <div id="prime"></div>
    </div>

    <script>
        let num = Number(prompt("Enter Range To Find Prime Number : "));
        document.getElementById("num").innerText = `Range : Up to ${num}`;

        let primeBox = document.getElementById("prime");
        let foundAny = false;

        for (let i = 2; i <= num; i++) {    
            let count = 0;

            for (let j = 1; j <= i; j++) {
                if (i % j === 0) {
                    count++;
                }
            }

            if (count === 2) {
                primeBox.innerText += (foundAny ? ", " : "") + i;
                foundAny = true;
            }
        }

        if (!foundAny) {
            primeBox.innerText = "No prime numbers in this range.";
        }
    </script>
</body>
</html>
