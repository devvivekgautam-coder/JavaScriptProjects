<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Table</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Arial Black', sans-serif;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #121212;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        body::before {
            content: "";
            position: absolute;
            width: 400px;
            height: 400px;
            background: #00ffcc;
            filter: blur(150px);
            opacity: 0.15;
            z-index: 0;
        }

        .neo-glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 4px solid #000;
            box-shadow: 12px 12px 0px #000;
            padding: 30px;
            width: 350px;
            text-align: center;
            color: #fff;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 26px;
            text-transform: uppercase;
            background: #00ffcc;
            color: #000;
            padding: 10px;
            border: 4px solid #000;
            margin-bottom: 25px;
            box-shadow: 6px 6px 0px #000;
        }

        .tag {
            background: #000;
            color: #00ffcc;
            padding: 5px 12px;
            font-size: 11px;
            display: inline-block;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        h2#num {
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            border: 3px solid #000;
            padding: 10px;
            font-size: 18px;
            margin-bottom: 20px;
            box-shadow: 4px 4px 0px #000;
        }

        #table {
            background: #fff;
            color: #000;
            border: 4px solid #000;
            padding: 15px;
            font-size: 20px;
            max-height: 300px;
            overflow-y: auto;
            box-shadow: 8px 8px 0px #000;
            text-align: left;
            padding-left: 40px;
            line-height: 1.8;
        }

        #table::-webkit-scrollbar { width: 8px; }
        #table::-webkit-scrollbar-track { background: #000; }
        #table::-webkit-scrollbar-thumb { background: #00ffcc; border: 2px solid #000; }
    </style>
</head>
<body>

    <div class="neo-glass-card">
        <h1>Math Table</h1>
        
        <div class="tag">Selected Number</div>
        <h2 id="num">Number: --</h2>

        <div class="tag">Calculation Results</div>
        <div id="table"></div>
    </div>

    <script>
        let num = Number(prompt("Enter Any Number To Find Table : "));
        document.getElementById("num").innerText = `Table of : ${num}`;

        let tableBox = document.getElementById("table");
        
        for (let i = 1; i <= 10; i++) {
            let tab = num * i;
            tableBox.innerHTML += `${num} x ${i} = <strong>${tab}</strong> <br>`;
        }
    </script>
</body>
</html>
