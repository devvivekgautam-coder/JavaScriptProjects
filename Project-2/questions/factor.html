<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factor System</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Arial Black', sans-serif;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #121212;
            background-image:
                linear-gradient(rgba(250, 249, 249, 0) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        body::before {
            content: "";
            position: absolute;
            width: 400px;
            height: 400px;
            background: #ff0055;
            filter: blur(150px);
            opacity: 0.3;
            z-index: 0;
        }

        .neo-glass-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 4px solid #000;
            box-shadow: 12px 12px 0px #000;
            padding: 40px;
            width: 350px;
            color: #fff;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 26px;
            text-transform: uppercase;
            background: #00ffcc;
            color: #000;
            padding: 10px;
            border: 4px solid #000;
            margin-bottom: 30px;
            box-shadow: 6px 6px 0px #000;
        }

        label {
            display: block;
            margin-bottom: 15px;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 2px;
            background: #000;
            padding: 5px;
            display: inline-block;
        }

        h2 {
            background: rgba(255, 255, 255, 0.95);
            color: #000;
            border: 3px solid #000;
            padding: 15px;
            margin-top: 15px;
            font-size: 20px;
            box-shadow: 4px 4px 0px #000;
        }

        #fact {
            font-size: 18px;
            max-height: 200px;
            overflow-y: auto;
            text-align: left;
            padding-left: 20px;
        }

        #fact::-webkit-scrollbar {
            width: 8px;
        }

        #fact::-webkit-scrollbar-track {
            background: transparent;
        }

        #fact::-webkit-scrollbar-thumb {
            background: #00ffcc;
            border: 2px solid #000;
        }
    </style>
</head>

<body>

    <div class="neo-glass-card">
        <h1>Factor System</h1>

        <label>System Output</label>

        <h2 id="num"></h2>
        <h2 id="fact"></h2>
    </div>

    <script>
        let num = Number(prompt("Enter Any Number To Find Factor : "));
        document.getElementById("num").innerText = `Number : ${num}`;

        for (let i = 1; i <= num; i++) {
            if (num % i == 0) {
                document.getElementById("fact").innerHTML += `Factor : ${i} <br>`;
            }
        }
    </script>
</body>

</html>
