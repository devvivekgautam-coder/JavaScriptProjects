<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Prime Number Extractor</title>

    <style>
        body {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            text-align: center;
            margin-top: 60px;
        }

        input {
            padding: 8px;
            width: 300px;
        }

        button {
            padding: 8px 15px;
            margin-left: 10px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h2>Find Prime Numbers</h2>

    <input type="text" id="arrayInput" placeholder="Enter numbers (comma separated)">
    <button onclick="findPrimes()">Find Primes</button>

    <div id="result"></div>

    <script>
        function isPrime(num) {
            if (num <= 1) return false;

            for (let i = 2; i <= Math.sqrt(num); i++) {
                if (num % i === 0) {
                    return false;
                }
            }
            return true;
        }

        function findPrimes() {
            let input = document.getElementById("arrayInput").value;

            if (input.trim() === "") {
                document.getElementById("result").innerText = "Please enter valid numbers!";
                return;
            }

            let arr = input.split(",").map(num => Number(num.trim()));

            let primeNumbers = arr.filter(num => isPrime(num));

            if (primeNumbers.length > 0) {
                document.getElementById("result").innerText = "Prime Numbers: " + primeNumbers.join(", ");
            } else {
                document.getElementById("result").innerText = "No prime numbers found!";
            }
        }
    </script>

</body>

</html>
