<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Find Element Index</title>

    <style>
        body {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            text-align: center;
            margin-top: 60px;
        }

        input {
            padding: 8px;
            margin: 5px;
            width: 250px;
        }

        button {
            padding: 8px 15px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h2>Find Element Index</h2>

    <input type="text" id="arrayInput" placeholder="Enter numbers (comma separated)">
    <br>
    <input type="number" id="searchElement" placeholder="Enter element to find">
    <br>
    <button onclick="findIndex()">Find Index</button>

    <div id="result"></div>

    <script>
        function linearSearch(arr, target) {
            for (let i = 0; i < arr.length; i++) {
                if (arr[i] === target) {
                    return i;
                }
            }
            return -1;
        }

        function findIndex() {
            let input = document.getElementById("arrayInput").value;
            let target = Number(document.getElementById("searchElement").value);

            let arr = input.split(",").map(num => Number(num.trim()));

            if (input === "") {
                document.getElementById("result").innerText = "Please enter valid array!";
                return;
            }

            let index = linearSearch(arr, target);

            if (index !== -1) {
                document.getElementById("result").innerText ="Element found at index: " + index;
            } else {
                document.getElementById("result").innerText ="Element not found!";
            }
        }
    </script>

</body>

</html>
